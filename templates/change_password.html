<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password — Report Automation Portal</title>
  <style>
    :root {
      --bg-page:        #0f172a;
      --bg-card:        rgba(255,255,255,.06);
      --border:         rgba(255,255,255,.12);
      --border-focus:   #3b82f6;
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-footer:    #475569;
      --input-bg:       rgba(255,255,255,.06);
      --input-border:   rgba(255,255,255,.14);
      --input-text:     #f1f5f9;
      --btn-bg:         linear-gradient(135deg,#143285 0%,#19295e 100%);
      --btn-toggle-bg:  rgba(255,255,255,.08);
      --btn-toggle-border: rgba(255,255,255,.15);
      --alert-error-bg:   rgba(239,68,68,.12);
      --alert-error-text: #fca5a5;
      --alert-error-border: rgba(239,68,68,.35);
      --alert-success-bg:   rgba(22,163,74,.12);
      --alert-success-text: #4ade80;
      --alert-success-border: rgba(22,163,74,.35);
      --alert-warn-bg:    rgba(249,115,22,.12);
      --alert-warn-text:  #fdba74;
      --alert-warn-border: rgba(249,115,22,.35);
    }
    [data-theme="light"] {
      --bg-page:        #f0f4f8;
      --bg-card:        #ffffff;
      --border:         #e2e8f0;
      --border-focus:   #2563eb;
      --text-primary:   #0f172a;
      --text-secondary: #475569;
      --text-footer:    #94a3b8;
      --input-bg:       #f8fafc;
      --input-border:   #cbd5e1;
      --input-text:     #0f172a;
      --btn-toggle-bg:  #f1f5f9;
      --btn-toggle-border: #cbd5e1;
      --alert-error-bg:   #fef2f2;
      --alert-error-text: #b91c1c;
      --alert-error-border: #fca5a5;
      --alert-success-bg:   #f0fdf4;
      --alert-success-text: #15803d;
      --alert-success-border: #86efac;
      --alert-warn-bg:    #fff7ed;
      --alert-warn-text:  #c2410c;
      --alert-warn-border: #fdba74;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { transition: background .25s; }
    html, body { height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      background: var(--bg-page);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text-primary);
    }
    [data-theme="dark"] body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 60%, #0f172a 100%);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.75rem 3rem 2.25rem;
      width: 90%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .portal-logo { height: 52px; width: auto; display: block; margin: 0 auto 1rem; }

    .card-title {
      font-size: 1.45rem; font-weight: 700; text-align: center;
      letter-spacing: .3px; margin-bottom: .25rem;
    }
    .card-subtitle {
      text-align: center; color: var(--text-secondary);
      font-size: .88rem; margin-bottom: .6rem;
    }
    .user-badge {
      text-align: center; font-size: .82rem; color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }
    .user-badge strong { color: var(--text-primary); }

    /* Alerts */
    .alert {
      border-radius: .6rem; padding: .7rem 1rem;
      font-size: .88rem; margin-bottom: 1.1rem;
      border: 1px solid transparent;
    }
    .alert-error   { background: var(--alert-error-bg);   color: var(--alert-error-text);   border-color: var(--alert-error-border); }
    .alert-success { background: var(--alert-success-bg); color: var(--alert-success-text); border-color: var(--alert-success-border); }
    .alert-warning { background: var(--alert-warn-bg);    color: var(--alert-warn-text);    border-color: var(--alert-warn-border); }

    /* Form */
    .form-group { margin-bottom: 1.1rem; }
    .form-group label {
      display: block; font-size: .85rem; font-weight: 600;
      margin-bottom: .4rem; color: var(--text-secondary);
    }
    .pw-wrap { position: relative; }
    .pw-wrap input {
      width: 100%; padding-right: 2.8rem;
      background: var(--input-bg); border: 1px solid var(--input-border);
      border-radius: .6rem; padding: .65rem .9rem; padding-right: 2.8rem;
      font-size: .95rem; color: var(--input-text); outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .pw-wrap input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59,130,246,.2);
    }
    .pw-wrap input::placeholder { color: var(--text-secondary); opacity: .7; }
    .pw-toggle {
      position: absolute; right: .75rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-secondary); font-size: 1.05rem; padding: 0; line-height: 1;
    }
    .pw-toggle:hover { color: var(--text-primary); }

    /* Strength bar */
    .strength-wrap { margin-top: .4rem; height: 4px; border-radius: 2px; background: var(--input-border); overflow: hidden; }
    .strength-bar  { height: 100%; border-radius: 2px; transition: width .3s, background .3s; width: 0%; }

    .btn-submit {
      width: 100%; padding: .72rem;
      background: var(--btn-bg); color: #fff;
      border: none; border-radius: .75rem;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: .5rem;
      transition: filter .15s, transform .15s;
    }
    .btn-submit:hover { filter: brightness(1.12); transform: translateY(-1px); }

    /* Footer */
    .divider { border: none; border-top: 1px solid var(--border); margin: 1.75rem 0 1.25rem; }
    .footer-row { display: flex; align-items: center; justify-content: space-between; }
    .footer-note { color: var(--text-footer); font-size: .76rem; }
    .back-link {
      color: var(--text-secondary); font-size: .82rem; text-decoration: none;
      display: inline-flex; align-items: center; gap: .35rem;
      transition: color .15s;
    }
    .back-link:hover { color: var(--text-primary); }
    .theme-toggle-btn {
      background: var(--btn-toggle-bg); border: 1px solid var(--btn-toggle-border);
      color: var(--text-secondary); border-radius: .6rem;
      padding: .3rem .7rem; font-size: .78rem; cursor: pointer;
    }
    .theme-toggle-btn:hover { color: var(--text-primary); border-color: var(--text-secondary); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/logo/logo.png" alt="Logo" class="portal-logo" onerror="this.style.display='none'">
    <div class="card-title">Change Password</div>
    <div class="card-subtitle">Report Automation Portal</div>
    <div class="user-badge">Signed in as <strong>{{ current_user }}</strong></div>

    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="alert alert-{{ category }}">{{ message }}</div>
    {% endfor %}

    <form method="post" action="/change-password" autocomplete="off">

      <div class="form-group">
        <label for="current_password">Current Password</label>
        <div class="pw-wrap">
          <input type="password" id="current_password" name="current_password"
                 placeholder="Enter current password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" onclick="togglePw('current_password', 'eye0')" id="eye0">&#128065;</button>
        </div>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <div class="pw-wrap">
          <input type="password" id="new_password" name="new_password"
                 placeholder="Enter new password" required autocomplete="new-password"
                 oninput="checkStrength(this.value)">
          <button type="button" class="pw-toggle" onclick="togglePw('new_password', 'eye1')" id="eye1">&#128065;</button>
        </div>
        <div class="strength-wrap mt-1">
          <div class="strength-bar" id="strength-bar"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm New Password</label>
        <div class="pw-wrap">
          <input type="password" id="confirm_password" name="confirm_password"
                 placeholder="Repeat new password" required autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw('confirm_password', 'eye2')" id="eye2">&#128065;</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Update Password</button>
    </form>

    <hr class="divider">
    <div class="footer-row">
      <a href="/" class="back-link">&#8592; Back to Portal</a>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="theme-btn">&#9680; Theme</button>
    </div>
  </div>

  <script>
    (function () {
      const saved = localStorage.getItem('cbsl-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      updateThemeBtn(saved);
    })();
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const nxt = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', nxt);
      localStorage.setItem('cbsl-theme', nxt);
      updateThemeBtn(nxt);
    }
    function updateThemeBtn(t) {
      const b = document.getElementById('theme-btn');
      if (b) b.innerHTML = t === 'dark' ? '&#9728; Light' : '&#9790; Dark';
    }
    function togglePw(id, btnId) {
      const inp = document.getElementById(id);
      const btn = document.getElementById(btnId);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.innerHTML = inp.type === 'password' ? '&#128065;' : '&#128584;';
    }
    function checkStrength(pw) {
      const bar = document.getElementById('strength-bar');
      let score = 0;
      if (pw.length >= 8)  score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const pct   = [0, 25, 50, 75, 100][score];
      const color = ['#ef4444','#f97316','#eab308','#22c55e','#16a34a'][score];
      bar.style.width      = pct + '%';
      bar.style.background = color;
    }
  </script>

  <!-- ── Inactivity timeout (10 min) ── -->
  <script>
  (function(){
    var TIMEOUT = 15 * 60 * 1000;
    var WARN_BEFORE = 60 * 1000;
    var timer, warnTimer, toast;
    function resetTimer() {
      clearTimeout(timer); clearTimeout(warnTimer);
      if (toast) { toast.remove(); toast = null; }
      warnTimer = setTimeout(showWarning, TIMEOUT - WARN_BEFORE);
      timer     = setTimeout(function(){ window.location.href = '/logout?reason=timeout'; }, TIMEOUT);
    }
    function showWarning() {
      toast = document.createElement('div');
      toast.id = 'inactivity-toast';
      toast.style.cssText = 'position:fixed;bottom:1.5rem;right:1.5rem;z-index:9999;background:#1e293b;border:1px solid rgba(249,115,22,.5);color:#fdba74;padding:.85rem 1.25rem;border-radius:.75rem;font-size:.88rem;font-family:Segoe UI,system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:320px;line-height:1.5;';
      toast.innerHTML = '&#9888; You will be signed out in <strong id="toast-countdown">60</strong>s due to inactivity. <a href="#" onclick="resetTimer();return false;" style="color:#60a5fa;text-decoration:underline;margin-left:.5rem;">Stay signed in</a>';
      document.body.appendChild(toast);
      var secs = 60;
      var interval = setInterval(function(){
        secs--;
        var el = document.getElementById('toast-countdown');
        if (el) el.textContent = secs;
        if (secs <= 0) clearInterval(interval);
      }, 1000);
    }
    ['mousemove','mousedown','keydown','touchstart','scroll','click'].forEach(function(e){
      document.addEventListener(e, resetTimer, { passive: true });
    });
    resetTimer();
  })();
  </script>
</body>
</html>
